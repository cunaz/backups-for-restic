# Three groups of jobs, each on a WordPress site of its own.
#
# The WordPress compatibility matrix runs the acceptance suite against a real WordPress
# (tests/Integration): setup through the REST API, backups driven by wp-cron.php with
# max_execution_time = 30 and memory_limit = 128M, a killed tick, restic check and restore,
# and a database import with identical checksums.
#
# "WordPress memory" is a matrix of three repository sizes (500000, 1000000 and 2000000
# blobs) that runs with every trigger. bin/bench-wordpress-memory.php builds a history of
# that size and drives a complete backup, check and prune job of the plugin, every tick in a
# new PHP process with memory_limit = 128M, max_execution_time = 30, set_time_limit()
# disabled and a full WordPress. The site is installed with BFR_DISABLE_WP_CRON=1, so that
# no request starts a tick that is not measured; the script refuses any other site. A size
# passes if no tick crashes, changes these limits or reserves more than 128 MiB, every job
# ends within 600 ticks and leaves no repository lock, a prune that succeeds deletes a pack,
# a check that succeeds finds no error, and restic check --read-data accepts the repository
# before and after. At 500000 blobs all three jobs must succeed; at the larger sizes each
# must succeed or fail with index_too_large. The reports of every tick and the logs are
# uploaded as the artifact wordpress-memory-<blobs>, also when the job fails.
#
# "Admin page in a browser" runs the browser tests (tests/E2E).
name: Integration

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '29 4 * * *'
  workflow_dispatch:
    inputs:
      acceptance:
        description: Use the acceptance sizes (2 GB of files, 300 MB of database)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wordpress:
    name: WordPress ${{ matrix.wordpress }} on PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { wordpress: '7.1.5', php: '8.3', memory: '128', large: true }
          - { wordpress: '7.1.5', php: '8.5', memory: '128', large: false }
          - { wordpress: '7.0.9', php: '8.3', memory: '128', large: false }
          - { wordpress: '7.0.9', php: '8.5', memory: '128', large: true }
          - { wordpress: '6.7.12', php: '8.3', memory: '128', large: true }
          - { wordpress: '6.7.12', php: '8.5', memory: '96', large: false }
    env:
      BFR_WP_VERSION: ${{ matrix.wordpress }}
      BFR_SITE_MEMORY_MIB: ${{ matrix.memory }}
      BFR_DB_HOST: 127.0.0.1
      BFR_DB_ADMIN_USER: root
      BFR_DB_ADMIN_PASSWORD: root
      BFR_TEST_MYSQL_HOST: 127.0.0.1
      BFR_TEST_MYSQL_USER: root
      BFR_TEST_MYSQL_PASSWORD: root
      # Records signals and exits of the PHP server's workers in .tools/strace.log.
      BFR_SITE_TRACE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, mysqli, curl
          ini-values: opcache.enable_cli=0
          coverage: none
          tools: composer:v2
      - name: Start MySQL
        run: sudo systemctl start mysql.service
      - name: Install strace
        run: command -v strace || sudo apt-get install -y --no-install-recommends strace
      - name: Keep core dumps of crashed PHP processes
        # The test server's PHP processes have died by SIGSEGV; a core dump shows where.
        run: sudo sysctl -w kernel.core_pattern="$RUNNER_TEMP/core.%e.%p"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/bin
          key: tools-${{ runner.os }}-${{ hashFiles('bin/install-test-tools.sh') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: bin/install-test-tools.sh restic rest-server wp-cli
      - run: bin/test-site.sh install
      - run: bin/test-site.sh install-multisite
      - run: ulimit -c "$(ulimit -Hc)" && bin/test-site.sh start
      - name: Integration tests
        env:
          BFR_SITE_FIXTURE_MB: ${{ matrix.large && (github.event_name == 'schedule' || inputs.acceptance) && '2048' || '64' }}
          BFR_DB_FIXTURE_MB: ${{ matrix.large && (github.event_name == 'schedule' || inputs.acceptance) && '300' || '32' }}
        # The killed-tick test restarts the server from PHPUnit, which passes the limit on.
        run: ulimit -c "$(ulimit -Hc)" && vendor/bin/phpunit -c phpunit-integration.xml.dist
      - name: How the server's workers ended
        if: always()
        # Signals and exits other than the clean ones, from strace (BFR_SITE_TRACE).
        run: grep -E 'killed by|exited with [1-9]|--- SIG' .tools/strace.log 2>/dev/null | grep -v -E 'SIGCHLD|SIGTERM' | head -n 50 || true
      - name: Backtraces of crashed PHP processes
        if: always()
        run: |
          shopt -s nullglob
          cores=( "$RUNNER_TEMP"/core.* )
          if [ ${#cores[@]} -eq 0 ]; then
            echo 'No PHP process left a core dump.'
            exit 0
          fi
          sudo apt-get install -y --no-install-recommends gdb > /dev/null
          for core in "${cores[@]}"; do
            echo "::group::$core"
            gdb -batch -nx -ex 'bt 60' -ex 'info sharedlibrary' "$(command -v php)" "$core" 2>&1 | grep -v -E '^\[(New|Thread) ' | head -n 200
            echo '::endgroup::'
          done
      - name: Collect logs
        if: failure()
        run: |
          mkdir -p logs
          cp .tools/site-server.log logs/ 2>/dev/null || true
          cp .tools/php-errors.log logs/ 2>/dev/null || true
          cp .tools/site/wp-content/debug.log logs/ 2>/dev/null || true
          cp .tools/requests.log logs/ 2>/dev/null || true
          cp .tools/strace.log logs/ 2>/dev/null || true
          # Workers that died by a signal or exited with an error, if any.
          grep -E 'killed by|exited with [1-9]|--- SIG' .tools/strace.log 2>/dev/null | grep -v 'SIGCHLD' | head -n 50 || true
          # Only operator-facing diagnostics. Undo journals and staged source bytes stay private.
          rsync -r --prune-empty-dirs --include='/*/' --include='/*/job.json' --include='/*/events.log' --exclude='*' .tools/site/wp-content/backups-for-restic/jobs/ logs/jobs/ 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: integration-logs-wp-${{ matrix.wordpress }}-php-${{ matrix.php }}
          path: logs/
          retention-days: 14

  memory:
    name: WordPress memory (${{ matrix.blobs }} blobs)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        blobs: [500000, 1000000, 2000000]
    env:
      BFR_DB_HOST: 127.0.0.1
      BFR_DB_ADMIN_USER: root
      BFR_DB_ADMIN_PASSWORD: root
      BFR_DISABLE_WP_CRON: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, mysqli, curl
          ini-values: opcache.enable_cli=0
          coverage: none
          tools: composer:v2
      - name: Start MySQL
        run: sudo systemctl start mysql.service
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/bin
          key: tools-${{ runner.os }}-${{ hashFiles('bin/install-test-tools.sh') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: bin/install-test-tools.sh restic rest-server
      - run: bin/test-site.sh install
      - run: bin/test-site.sh start
      - name: Full WordPress jobs in fresh 128M processes
        # The producer has 512M. The script starts every measured WordPress tick with
        # 128M, max_execution_time=30 and set_time_limit disabled, and verifies those limits.
        run: php -d memory_limit=512M bin/bench-wordpress-memory.php ${{ matrix.blobs }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: wordpress-memory-${{ matrix.blobs }}
          # These explicit report/log paths are inside the hidden .tools directory.
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .tools/memory-*.jsonl
            .tools/memory-worker-errors.log
            .tools/php-errors.log
            .tools/site-server.log
            .tools/site/wp-content/debug.log
          retention-days: 14

  browser:
    name: Admin page in a browser
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BFR_E2E_EXPECT_DATABASE_SWAP: "1"
      BFR_DB_HOST: 127.0.0.1
      BFR_DB_ADMIN_USER: root
      BFR_DB_ADMIN_PASSWORD: root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, mysqli, curl
          ini-values: opcache.enable_cli=0
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Start MySQL
        run: sudo systemctl start mysql.service
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/bin
          key: tools-${{ runner.os }}-${{ hashFiles('bin/install-test-tools.sh') }}
      - run: bin/install-test-tools.sh rest-server
      # Install a copy at its normal location so live restore exercises the package's path protections.
      - run: bin/build-package.sh
      - run: BFR_TEST_PLUGIN_DIR="$PWD/build/backups-for-restic" bin/test-site.sh install
      # The disposable MySQL account needs to see inbound relationships across schemas.
      - name: Grant dictionary inspection to the browser fixture
        env:
          MYSQL_PWD: ${{ env.BFR_DB_ADMIN_PASSWORD }}
        run: mysql -h "$BFR_DB_HOST" -u "$BFR_DB_ADMIN_USER" -e "GRANT PROCESS ON *.* TO 'bfr_site'@'localhost', 'bfr_site'@'%';"
      - run: bin/test-site.sh start
      # Exactly the packages of package-lock.json, without their install scripts; the browser
      # is then fetched by the Playwright version that the lock file names.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Without --with-deps: the runner image has the libraries Chromium needs, and the fonts
      # that option adds through apt are not worth a job that fails whenever the package
      # mirror cannot be reached.
      - run: npx playwright install chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Collect logs
        if: failure()
        run: |
          mkdir -p logs
          cp -r .tools/e2e-results logs/ 2>/dev/null || true
          cp .tools/site-server.log .tools/php-errors.log .tools/requests.log logs/ 2>/dev/null || true
          cp .tools/site/wp-content/debug.log logs/ 2>/dev/null || true
          # Only operator-facing diagnostics. Undo journals and staged source bytes stay private.
          rsync -r --prune-empty-dirs --include='/*/' --include='/*/job.json' --include='/*/events.log' --exclude='*' .tools/site/wp-content/backups-for-restic/jobs/ logs/jobs/ 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-logs
          path: logs/
          retention-days: 14
