# Fast checks on every push and pull request (docs/04-development-and-quality.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request cancels its superseded runs. Runs on main never cancel each other: every commit
# keeps the results that the release gate reads (docs/04 §7).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Composer for every PHP job, verified by setup-php against the SHA-256 of its release PHAR
  # (getcomposer.org publishes it, and the PHAR carries an OpenPGP signature by Composer's
  # release key 161DFBE342889F01DDAC4E61CBB3D576F2A0946F). A new version is a reviewed change.
  PHP_TOOLS: composer:2.11.2@sha256:dd158c0afd41d15fac89e1b4e47b5d42911fe316c3687cd5edac98319b25d028

jobs:
  lint:
    name: Coding standards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: ${{ env.PHP_TOOLS }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpcs
      - name: JavaScript syntax
        run: node --check assets/js/admin.js

  eslint:
    name: JavaScript (ESLint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # Exactly the packages of package-lock.json; none of them may run an install script.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint:js

  analyse:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: ${{ env.PHP_TOOLS }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpstan.phar analyse --no-progress --memory-limit=1G

  plugin-check:
    name: Plugin Check on the package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The scanner of the WordPress.org review team sees what would ship, not the repository.
      - run: bin/build-package.sh
      - name: Rehearse a signed release in local Git and SVN repositories
        run: |
          if ! command -v svnadmin >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y subversion; fi
          tests/Release/test-wordpress-org.sh
      - name: Release gates against recorded GitHub responses
        run: python3 tests/Release/test_release_gates.py
      - uses: ./.github/actions/check-package

  pot:
    name: Translation template (POT)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: ${{ env.PHP_TOOLS }}
      - run: bin/install-test-tools.sh wp-cli
      # Builds the package and extracts the strings of its PHP and JavaScript files. WP-CLI
      # only warns about a string it finds fault with, for example one with two different
      # translator comments; here a warning fails the job.
      - name: Build the template
        shell: bash
        run: |
          composer pot 2>&1 | tee "$RUNNER_TEMP/make-pot.log"
          if grep -q '^Warning:' "$RUNNER_TEMP/make-pot.log"; then
            echo '::error::wp i18n make-pot warns about translatable strings; see the log of this step.'
            exit 1
          fi
      # make-pot leaves out a file it cannot parse without failing. So look for a string
      # that only the admin script has, for one that only src/ has, and for a translator
      # comment that comes from JavaScript.
      - name: Strings of admin.js and src/ are in the template
        run: |
          pot=languages/backups-for-restic.pot
          echo "$(grep -c '^msgid ' "$pot") entries; $(grep -c 'assets/js/admin.js:' "$pot") lines refer to the admin script."
          grep -F 'msgid "Keep this tab open to speed up the job on slow hosts."' "$pot"
          grep -F 'msgid "Plugin activation refused"' "$pot"
          grep -B 3 -F 'msgid "Data that no snapshot uses is deleted next on %s."' "$pot" | grep -F '#. translators: %s: date and time.'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: translation-template
          path: languages/backups-for-restic.pot
          retention-days: 14

  sign-off:
    name: Commits are signed off
    # Dependabot cannot sign off. Its pull requests are known by the account that opened them,
    # which GitHub sets and no contributor can take on, not by a name written into a commit.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: the commits of the pull request are compared with its base.
          fetch-depth: 0
      # Developer Certificate of Origin (CONTRIBUTING.md): every commit of the pull request,
      # merge commits included, carries a Signed-off-by trailer.
      - name: Every commit has a Signed-off-by trailer
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          commits="$(git rev-list "$BASE_SHA..$HEAD_SHA")"
          missing=0
          for commit in $commits; do
            if [ -z "$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$commit")" ]; then
              git show -s --format='%h %s' "$commit"
              missing=$((missing + 1))
            fi
          done
          echo "Commits in the pull request: $(echo "$commits" | grep -c .); without a Signed-off-by trailer: $missing."
          if [ "$missing" -gt 0 ]; then
            echo "::error::Commits without a Signed-off-by trailer: $missing, listed in the log. Sign off with: git commit -s (CONTRIBUTING.md)."
            exit 1
          fi

  unit:
    name: Unit tests (PHP ${{ matrix.php }}${{ matrix.zstd && ', zstd' || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5', '8.6']
        zstd: [false]
        # Both configurations are supported: with ext-zstd the plugin reads format 2
        # repositories natively, without it the tests of the refusal run instead.
        include:
          - php: '8.3'
            zstd: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.zstd && 'mbstring, openssl, sodium, zstd' || 'mbstring, openssl, sodium' }}
          # Shared hosting rarely runs OPcache or JIT for CLI; test the slow path.
          ini-values: opcache.enable_cli=0
          coverage: none
          tools: ${{ env.PHP_TOOLS }}
      - name: The zstd extension is ${{ matrix.zstd && 'loaded' || 'not loaded' }}
        env:
          ZSTD: ${{ matrix.zstd }}
        run: |
          php -r "exit(extension_loaded('zstd') === (\$argv[1] === 'true') ? 0 : 1);" "$ZSTD"
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit --testsuite unit --log-junit "$RUNNER_TEMP/unit.xml"
      # A test that skips because something is missing must not turn the job green.
      - name: Skipped tests are the expected ones
        env:
          EXPECTED: tests/Skips/unit${{ matrix.zstd && '-zstd' || '' }}.txt
        run: php bin/check-skipped-tests.php "$RUNNER_TEMP/unit.xml" "$EXPECTED"

  database:
    name: Database dump and restore (${{ matrix.database }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Exact releases by digest; a new image is a reviewed change, like a new restic.
          - database: MySQL 8.4
            image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
            health: mysqladmin ping -h 127.0.0.1 -proot --silent
            skips: tests/Skips/database-mysql.txt
          # MariaDB skips the cases of the atomic exchange, which is MySQL-only by design.
          - database: MariaDB 11.4
            image: mariadb:11.4.13@sha256:a8992b5e5404d11e03c54a31d0c1bdea3fd116d283aa6d1a627551f29045309b
            health: healthcheck.sh --connect --innodb_initialized
            skips: tests/Skips/database-mariadb.txt
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
        ports:
          - 33306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      BFR_TEST_MYSQL_HOST: 127.0.0.1:33306
      BFR_TEST_MYSQL_USER: root
      BFR_TEST_MYSQL_PASSWORD: root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, mysqli
          coverage: none
          tools: ${{ env.PHP_TOOLS }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit --testsuite database --log-junit "$RUNNER_TEMP/database.xml"
      # Every test of the suite skips when the server does not answer.
      - name: Skipped tests are the expected ones
        env:
          EXPECTED: ${{ matrix.skips }}
        run: php bin/check-skipped-tests.php "$RUNNER_TEMP/database.xml" "$EXPECTED"

  mutation:
    name: Mutation testing (Crypto, Format, Forget, database import)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request is checked out as its merge into the base branch. With the two
          # parents of that commit the next step can list the files the pull request changes.
          fetch-depth: 2
      # The run takes about 40 minutes, so a pull request that cannot change its result skips
      # it and the job ends green. Such a pull request touches neither the mutated code
      # (src/Crypto, src/Format, src/Engine/Forget, src/Database/Restore), nor the code it
      # calls, nor the tests, the tools or this workflow. The list is wider than needed on
      # purpose. A push to main always runs in full, and so does a pull request whose files
      # cannot be listed.
      - name: Can this change alter the result?
        id: changes
        uses: ./.github/actions/mutation-scope
        with:
          watched: '^(src/(Crypto|Format|Engine|Support|Exception|Backend|Storage|Secrets|Database)/|tests/|(infection\.json5\.dist|composer\.json|composer\.lock|phpunit\.xml\.dist|bin/install-test-tools\.sh|bin/mutation-gate\.sh|\.github/workflows/ci\.yml)$)'
          label: src/Crypto, src/Format, src/Engine, src/Support, src/Exception, src/Backend, src/Storage, src/Secrets, src/Database, tests/, infection.json5.dist, composer.json, composer.lock, phpunit.xml.dist, bin/install-test-tools.sh, bin/mutation-gate.sh, .github/workflows/ci.yml
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: steps.changes.outputs.run == 'true'
        with:
          php-version: '8.3'
          # With ext-zstd the native decompression of format 2 is mutated and tested too.
          extensions: zstd
          coverage: pcov
          tools: ${{ env.PHP_TOOLS }}
      - run: composer install --no-interaction --no-progress --prefer-dist
        if: steps.changes.outputs.run == 'true'
      - run: bin/install-test-tools.sh infection
        if: steps.changes.outputs.run == 'true'
      # composer mutation passes --with-uncovered, so code that no test reaches counts too. The
      # gates (covered MSI of at least 90 %, and the floor for the MSI) live in
      # infection.json5.dist.
      - run: composer mutation -- --no-progress
        if: steps.changes.outputs.run == 'true'
      # A gate that measured nothing must not pass: show the counts and require mutants.
      - name: Mutation summary
        if: always() && steps.changes.outputs.run == 'true'
        run: |
          cat .tools/infection/summary.log
          grep -Eq '^Total: [1-9]' .tools/infection/summary.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.changes.outputs.run == 'true'
        with:
          name: mutation-logs
          path: .tools/infection/
          retention-days: 14

  # The restore code that the unit tests reach, in four gates with their own scores
  # (docs/04 §5.6): the planner at 90 %, the others at floors that may only rise. The database
  # half of restore needs a server and runs in database-mutation.yml.
  restore-mutation:
    name: Mutation testing (${{ matrix.area }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { gate: planner, area: file apply planner }
          - { gate: restore, area: file restore }
          - { gate: apply, area: file apply jobs }
          - { gate: zip, area: ZIP downloads }
    env:
      GATE: ${{ matrix.gate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Can this change alter the result?
        id: changes
        uses: ./.github/actions/mutation-scope
        with:
          watched: '^(src/|tests/|(infection-(planner|restore|apply|zip)\.json5\.dist|composer\.json|composer\.lock|bin/install-test-tools\.sh|bin/mutation-gate\.sh|\.github/workflows/ci\.yml)$)'
          label: src/, tests/, infection-planner.json5.dist, infection-restore.json5.dist, infection-apply.json5.dist, infection-zip.json5.dist, composer.json, composer.lock, bin/install-test-tools.sh, bin/mutation-gate.sh, .github/workflows/ci.yml
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: steps.changes.outputs.run == 'true'
        with:
          php-version: '8.3'
          extensions: zip, zstd
          coverage: pcov
          tools: ${{ env.PHP_TOOLS }}
      - run: composer install --no-interaction --no-progress --prefer-dist
        if: steps.changes.outputs.run == 'true'
      - run: bin/install-test-tools.sh infection
        if: steps.changes.outputs.run == 'true'
      - run: composer "mutation:$GATE" -- --no-progress
        if: steps.changes.outputs.run == 'true'
      - name: Require a measured mutation score
        if: always() && steps.changes.outputs.run == 'true'
        run: |
          cat ".tools/infection-$GATE/summary.log"
          grep -Eq '^Total: [1-9]' ".tools/infection-$GATE/summary.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.changes.outputs.run == 'true'
        with:
          name: ${{ matrix.gate }}-mutation-logs
          path: .tools/infection-${{ matrix.gate }}/
          retention-days: 14
