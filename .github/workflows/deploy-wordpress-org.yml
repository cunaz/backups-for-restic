# Publishes a signed stable release to WordPress.org (docs/04 §7). Before the owner is asked to
# approve, the check job verifies the tag and its signature by the pinned release key, the
# protections that the process relies on (the rulesets of main and of release tags, the
# wordpress-org environment), the test results of the tagged commit on main, its versions and
# changelogs, and its package. Only then does the deploy job wait for the approval.
name: Deploy a signed stable release to WordPress.org
on:
  push:
    # Stable releases only; a release candidate such as v0.3.0-rc.1 starts nothing.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  # To retry, re-run the tag's own run (GitHub allows that for 30 days). After that, dispatch
  # this workflow on the tag itself (Use workflow from: Tags), never on a branch: the
  # environment deploys tags only.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wordpress-org-release
  cancel-in-progress: false

jobs:
  check:
    name: Verify signature, protections, test results and package
    permissions:
      actions: read
      contents: read
      security-events: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
      tag_object: ${{ steps.release.outputs.tag_object }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - name: The run belongs to a stable release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" != tag || ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Run this workflow on a stable vX.Y.Z tag, not on the $REF_TYPE $TAG."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # main's copies of the scripts and of the pinned key fingerprint check the tag, so a
      # tagged commit cannot weaken the check of its own signature.
      - id: release
        name: Verify the tag and its signature by the pinned release key
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          commit="$(bin/verify-release-tag.sh "$TAG")"
          {
            echo "commit=$commit"
            echo "tag=$TAG"
            echo "tag_object=$(git rev-parse "refs/tags/$TAG")"
          } >> "$GITHUB_OUTPUT"
      # Both checks list every requirement that is not met before the step fails.
      - name: Repository protections and test results of the signed commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          status=0
          python3 bin/check-release-gates.py protections --tag "$TAG" || status=1
          python3 bin/check-release-gates.py evidence --commit "$RELEASE_COMMIT" || status=1
          exit "$status"
      - id: package
        name: Build the package of the signed commit and check its versions
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git checkout --detach "$RELEASE_COMMIT"
          bin/build-package.sh --zip
          python3 bin/prepare-wordpress-org.py --check-only "${TAG#v}" build/backups-for-restic
          echo "sha256=$(sha256sum build/backups-for-restic.zip | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/check-package

  deploy:
    name: Publish and compare SVN tag
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Holds the SVN credentials and requires the owner's approval; the check job above has
    # verified that it does, and that it deploys tags only (docs/04 §7.1).
    environment: wordpress-org
    env:
      TAG: ${{ needs.check.outputs.tag }}
      EXPECTED_SHA256: ${{ needs.check.outputs.sha256 }}
      SVN_URL: https://plugins.svn.wordpress.org/backups-for-restic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false
      - name: Rebuild verified archive and prepare working copy
        run: |
          if ! command -v svn >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y subversion; fi
          bin/build-package.sh --zip
          echo "$EXPECTED_SHA256  build/backups-for-restic.zip" | sha256sum --check
          python3 bin/prepare-wordpress-org.py "${TAG#v}" build/backups-for-restic .wordpress-org "$SVN_URL" "$RUNNER_TEMP/wporg"
      - name: Commit trunk, immutable tag and listing assets together
        env:
          SVN_USERNAME: ${{ secrets.WORDPRESS_ORG_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WORDPRESS_ORG_SVN_PASSWORD }}
        run: |
          status="$(svn status --quiet "$RUNNER_TEMP/wporg")"
          if [[ -n "$status" ]]; then
            : "${SVN_USERNAME:?Set the WordPress.org SVN username in the environment.}"
            : "${SVN_PASSWORD:?Set its dedicated SVN password in the environment.}"
            printf '%s\n' "$SVN_PASSWORD" | svn commit --non-interactive --no-auth-cache --username "$SVN_USERNAME" --password-from-stdin -m "Release $TAG" "$RUNNER_TEMP/wporg"
          fi
      - name: Verify public SVN bytes against the signed source package
        run: |
          svn export --non-interactive --ignore-externals "$SVN_URL/tags/${TAG#v}" "$RUNNER_TEMP/published"
          diff -qr --no-dereference build/backups-for-restic "$RUNNER_TEMP/published"

  notes:
    name: Publish release notes
    needs: [check, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.check.outputs.tag }}
      TAG_OBJECT: ${{ needs.check.outputs.tag_object }}
      RELEASE_COMMIT: ${{ needs.check.outputs.commit }}
    steps:
      # The notes must describe what was deployed: a tag moved while the deployment waited for
      # approval would give them another commit.
      - name: The tag still names the verified and deployed commit
        run: |
          ref="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')"
          if [[ "$ref" != "tag $TAG_OBJECT" ]]; then
            echo "::error::$TAG now names the $ref, not the tag object $TAG_OBJECT that was verified and deployed. Find out why before writing release notes by hand."
            exit 1
          fi
          target="$(gh api "repos/$GH_REPO/git/tags/$TAG_OBJECT" --jq '.object.type + " " + .object.sha')"
          if [[ "$target" != "commit $RELEASE_COMMIT" ]]; then
            echo "::error::The tag object $TAG_OBJECT names the $target, not the deployed commit $RELEASE_COMMIT."
            exit 1
          fi
      - run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi
