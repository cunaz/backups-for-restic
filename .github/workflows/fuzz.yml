# Nightly fuzzing of every parser that reads server data (ADR 0024).
name: Fuzzing

on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: '120'

permissions:
  contents: read

env:
  # Composer verified against the SHA-256 of its release PHAR, as in ci.yml.
  PHP_TOOLS: composer:2.11.2@sha256:dd158c0afd41d15fac89e1b4e47b5d42911fe316c3687cd5edac98319b25d028

jobs:
  fuzz:
    # The release gate reads the duration from this name: a release needs a run of at least
    # 120 seconds per target on its commit (docs/04 §7).
    name: Fuzz parsers (${{ inputs.seconds || '120' }} s per target)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: ${{ env.PHP_TOOLS }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Fuzz
        env:
          FUZZ_SECONDS: ${{ inputs.seconds || '120' }}
        run: php bin/fuzz.php --seconds="$FUZZ_SECONDS" --seed="$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-findings
          path: .tools/fuzz-findings/
          retention-days: 30
