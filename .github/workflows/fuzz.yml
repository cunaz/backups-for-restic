# Nightly fuzzing of every parser that reads server data (ADR 0024).
name: Fuzzing

on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: '120'

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz parsers
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Fuzz
        env:
          FUZZ_SECONDS: ${{ inputs.seconds || '120' }}
        run: php bin/fuzz.php --seconds="$FUZZ_SECONDS" --seed="$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-findings
          path: .tools/fuzz-findings/
          retention-days: 30
