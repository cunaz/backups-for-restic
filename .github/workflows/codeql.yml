name: CodeQL for the WordPress admin interface

on:
  # Every commit on main gets an analysis: the release gate requires one for the release
  # commit (docs/04 §7). It takes a few minutes.
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: ['assets/js/**', '.github/workflows/codeql.yml']
  schedule:
    - cron: '19 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # init and analyze run at the same version: with two versions the analysis ends with a
      # configuration error. Dependabot updates them in one pull request (dependabot.yml).
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: javascript-typescript
          build-mode: none
          config: |
            paths:
              - assets/js
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:javascript-typescript
